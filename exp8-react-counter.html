<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 8 - React useState</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #ecfeff; margin: 0; }
    main { max-width: 520px; margin: 60px auto; padding: 28px; text-align: center; background: white; border-radius: 8px; }
    .count { font-size: 56px; font-weight: bold; margin: 20px; }
    button { margin: 6px; padding: 10px 18px; border: 0; border-radius: 4px; background: #0891b2; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="text/babel">
    function Counter() {
      const [count, setCount] = React.useState(0);
      return (
        <>
          <h1>Counter Application</h1>
          <div className="count">{count}</div>
          <button onClick={() => setCount(count + 1)}>Increment (+)</button>
          <button onClick={() => setCount(count - 1)}>Decrement (-)</button>
          <button onClick={() => setCount(0)}>Reset</button>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Counter />);
  </script>
</body>
</html>
