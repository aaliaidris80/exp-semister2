<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 6 - DOM Events</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; background: #f9fafb; color: #111827; transition: background .2s; }
    main { max-width: 720px; margin: 32px auto; padding: 24px; background: white; border-radius: 8px; box-shadow: 0 10px 24px #0001; }
    input, button { padding: 10px; margin: 6px; }
    button { border: 0; border-radius: 4px; background: #7c3aed; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">DOM Manipulation Demo</h1>
    <input id="message" placeholder="Enter a message">
    <p id="paragraph">This paragraph can be shown, hidden, and styled dynamically.</p>
    <button id="changeHeading">Change Heading</button>
    <button id="changeBg">Change Background</button>
    <button id="fontSize">Change Font Size</button>
    <button id="togglePara">Show/Hide Paragraph</button>
    <button id="reset">Reset Page</button>
  </main>

  <script>
    const heading = document.getElementById('heading');
    const paragraph = document.getElementById('paragraph');
    const message = document.getElementById('message');

    document.getElementById('changeHeading').onclick = () => {
      heading.textContent = message.value || 'Heading changed using onclick';
    };

    document.getElementById('changeBg').onmouseover = () => {
      document.body.style.background = '#dbeafe';
    };

    message.onchange = () => {
      paragraph.textContent = message.value;
    };

    document.getElementById('fontSize').addEventListener('click', () => {
      paragraph.style.fontSize = paragraph.style.fontSize === '22px' ? '16px' : '22px';
    });

    document.getElementById('togglePara').addEventListener('click', () => {
      paragraph.style.display = paragraph.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('reset').addEventListener('click', () => {
      heading.textContent = 'DOM Manipulation Demo';
      paragraph.textContent = 'This paragraph can be shown, hidden, and styled dynamically.';
      paragraph.style = '';
      message.value = '';
      document.body.style.background = '#f9fafb';
    });
  </script>
</body>
</html>
