<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 9 - React Form Validation</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; }
    main { max-width: 520px; margin: 40px auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 10px 24px #0001; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin: 10px 0; }
    button { padding: 10px 16px; border: 0; border-radius: 4px; background: #16a34a; color: white; }
    .error { color: #dc2626; font-size: 14px; }
    .success { color: #15803d; font-weight: bold; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="text/babel">
    function RegistrationForm() {
      const [form, setForm] = React.useState({ name: '', email: '', password: '' });
      const [errors, setErrors] = React.useState({});
      const [success, setSuccess] = React.useState('');

      function handleChange(event) {
        setForm({ ...form, [event.target.name]: event.target.value });
      }

      function validate() {
        const nextErrors = {};
        if (!form.name.trim()) nextErrors.name = 'Name should not be empty.';
        if (!form.email.includes('@')) nextErrors.email = 'Email must contain @.';
        if (form.password.length < 6) nextErrors.password = 'Password must be at least 6 characters.';
        return nextErrors;
      }

      function handleSubmit(event) {
        event.preventDefault();
        const nextErrors = validate();
        setErrors(nextErrors);
        setSuccess(Object.keys(nextErrors).length ? '' : 'Registration successful.');
      }

      return (
        <>
          <h1>Registration Form</h1>
          <form onSubmit={handleSubmit}>
            <input name="name" placeholder="Name" value={form.name} onChange={handleChange} />
            {errors.name && <p className="error">{errors.name}</p>}
            <input name="email" placeholder="Email" value={form.email} onChange={handleChange} />
            {errors.email && <p className="error">{errors.email}</p>}
            <input name="password" type="password" placeholder="Password" value={form.password} onChange={handleChange} />
            {errors.password && <p className="error">{errors.password}</p>}
            <button type="submit">Submit</button>
          </form>
          {success && <p className="success">{success}</p>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RegistrationForm />);
  </script>
</body>
</html>
